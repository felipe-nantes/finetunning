[project]
name = "finetunning-decria"
version = "0.1.0"
description = "QLoRA cybersecurity assistant fine-tuned on a GTX 1060 6GB"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "peft==0.20.0",
    "trl==1.13.0",
    "datasets==5.0.1",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "huggingface-hub==1.31.0",
    "datasketch==2.0.0",
    "langdetect==1.0.9",
    "pyyaml==6.0.3",
    "tensorboard==2.21.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

# torch comes from a platform-specific PyTorch index:
#   - Linux (desktop, WSL2 + GTX 1060): CUDA 12.6 build. Its wheels ship SASS for
#     sm_60, which runs on the 1060's sm_61. Never switch to cu130+ (drops Pascal).
#   - Windows (laptop, no NVIDIA GPU): CPU build, enough to run the unit tests.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
